<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leafy — Plant Identifier</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --moss: #2d4a2d;
    --sage: #7a9e7e;
    --cream: #f5f0e8;
    --bark: #4a3728;
    --leaf: #5a8a3c;
    --gold: #c8a84b;
    --mist: #e8ede4;
    --ink: #1a2e1a;
  }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 80%, rgba(90,138,60,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(45,74,45,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 52px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .logo-icon {
    font-size: 32px;
    animation: sway 4s ease-in-out infinite;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  .logo-text {
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    font-weight: 700;
    color: var(--moss);
    letter-spacing: -1px;
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sage);
    opacity: 0.8;
  }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed var(--sage);
    border-radius: 16px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    background: rgba(255,255,255,0.4);
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .upload-zone::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(90,138,60,0.05), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .upload-zone:hover::before,
  .upload-zone.drag-over::before { opacity: 1; }

  .upload-zone:hover,
  .upload-zone.drag-over {
    border-color: var(--leaf);
    border-style: solid;
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(45,74,45,0.12);
  }

  .upload-icon {
    font-size: 52px;
    margin-bottom: 16px;
    display: block;
    transition: transform 0.3s;
  }

  .upload-zone:hover .upload-icon { transform: scale(1.1) translateY(-4px); }

  .upload-label {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--moss);
    display: block;
    margin-bottom: 8px;
  }

  .upload-sub {
    font-size: 11px;
    color: var(--sage);
    letter-spacing: 1px;
  }

  #fileInput { display: none; }

  .btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
  }

  .btn {
    flex: 1;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s ease;
    font-weight: 500;
  }

  .btn-primary {
    background: var(--moss);
    color: var(--cream);
  }

  .btn-primary:hover {
    background: var(--ink);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(45,74,45,0.25);
  }

  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary {
    background: transparent;
    color: var(--moss);
    border: 1.5px solid var(--sage);
  }

  .btn-secondary:hover {
    background: var(--mist);
    border-color: var(--moss);
  }

  /* Preview */
  #previewWrap {
    display: none;
    margin-bottom: 24px;
    position: relative;
  }

  #preview {
    width: 100%;
    border-radius: 12px;
    max-height: 320px;
    object-fit: cover;
    display: block;
    box-shadow: 0 8px 32px rgba(45,74,45,0.15);
  }

  .preview-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--cream);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--sage);
    cursor: pointer;
    transition: all 0.2s;
  }

  .preview-badge:hover {
    background: var(--ink);
    color: var(--cream);
  }

  /* Loading */
  #loading {
    display: none;
    text-align: center;
    padding: 48px 0;
  }

  .leaf-spinner {
    font-size: 40px;
    display: inline-block;
    animation: spin-leaf 1.4s ease-in-out infinite;
    margin-bottom: 20px;
  }

  @keyframes spin-leaf {
    0%   { transform: rotate(0deg) scale(1); }
    50%  { transform: rotate(180deg) scale(1.15); }
    100% { transform: rotate(360deg) scale(1); }
  }

  .loading-text {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--sage);
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* Results */
  #results {
    display: none;
    animation: fadeUp 0.5s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .plant-name-block {
    background: var(--moss);
    color: var(--cream);
    border-radius: 14px 14px 0 0;
    padding: 28px 28px 20px;
  }

  .plant-common {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 6px;
  }

  .plant-scientific {
    font-size: 12px;
    font-style: italic;
    opacity: 0.65;
    letter-spacing: 0.5px;
  }

  .confidence-bar-wrap {
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .confidence-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.6;
    white-space: nowrap;
  }

  .confidence-bar {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    overflow: hidden;
  }

  .confidence-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 1s ease;
    width: 0%;
  }

  .confidence-pct {
    font-size: 11px;
    opacity: 0.8;
    min-width: 32px;
    text-align: right;
  }

  /* Care cards */
  .care-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    background: #d4cfc6;
  }

  .care-card {
    background: #fff;
    padding: 20px 22px;
    position: relative;
    overflow: hidden;
  }

  .care-card::after {
    content: attr(data-emoji);
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 28px;
    opacity: 0.15;
  }

  .care-card-label {
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 6px;
  }

  .care-card-value {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    color: var(--moss);
    font-weight: 700;
    margin-bottom: 4px;
  }

  .care-card-desc {
    font-size: 10px;
    color: #888;
    line-height: 1.5;
  }

  /* Alert / main advice */
  .plant-advice {
    background: var(--mist);
    border-radius: 0 0 14px 14px;
    padding: 24px 28px;
  }

  .advice-title {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sage);
    margin-bottom: 12px;
  }

  .advice-text {
    font-size: 13px;
    line-height: 1.8;
    color: var(--bark);
  }

  /* Status pill */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 16px;
    font-weight: 500;
  }

  .status-good { background: #e8f5e9; color: #2e7d32; }
  .status-warn { background: #fff8e1; color: #f57f17; }
  .status-alert { background: #fce4ec; color: #c62828; }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    animation: blink 1.5s ease-in-out infinite;
  }

  .status-good .status-dot { background: #43a047; }
  .status-warn .status-dot { background: #ffa000; }
  .status-alert .status-dot { background: #e53935; }

  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Error */
  #errorBox {
    display: none;
    background: #fff0f0;
    border: 1.5px solid #ffcdd2;
    border-radius: 12px;
    padding: 20px 24px;
    font-size: 13px;
    color: #b71c1c;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  /* Fun footer */
  footer {
    text-align: center;
    margin-top: 56px;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--sage);
    opacity: 0.6;
  }

  @media (max-width: 480px) {
    .care-grid { grid-template-columns: 1fr; }
    .plant-common { font-size: 24px; }
    .btn-row { flex-direction: column; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">
      <span class="logo-icon">🌿</span>
      <span class="logo-text">Leafy</span>
    </div>
    <p class="tagline">AI Plant Identifier &amp; Care Guide</p>
  </header>

  <!-- Upload area -->
  <div class="upload-zone" id="uploadZone">
    <span class="upload-icon">📷</span>
    <span class="upload-label">Drop a plant photo here</span>
    <p class="upload-sub">or click to choose · jpg, png, webp, heic</p>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📁 Choose File</button>
    <button class="btn btn-secondary" id="cameraBtn">📸 Camera</button>
    <button class="btn btn-primary" id="analyzeBtn" disabled>🔍 Identify Plant</button>
  </div>

  <!-- Preview -->
  <div id="previewWrap">
    <img id="preview" alt="Plant preview">
    <span class="preview-badge" onclick="resetAll()">✕ Remove</span>
  </div>

  <!-- Error -->
  <div id="errorBox"></div>

  <!-- Loading -->
  <div id="loading">
    <div class="leaf-spinner">🍃</div>
    <p class="loading-text">Analysing your plant…</p>
  </div>

  <!-- Results -->
  <div id="results">
    <div class="plant-name-block">
      <div id="plantCommon" class="plant-common"></div>
      <div id="plantScientific" class="plant-scientific"></div>
      <div class="confidence-bar-wrap">
        <span class="confidence-label">Confidence</span>
        <div class="confidence-bar"><div class="confidence-fill" id="confFill"></div></div>
        <span class="confidence-pct" id="confPct"></span>
      </div>
    </div>

    <div class="care-grid" id="careGrid"></div>

    <div class="plant-advice">
      <p class="advice-title">Care Summary</p>
      <div id="statusPill"></div>
      <p class="advice-text" id="adviceText"></p>
    </div>
  </div>

  <footer>Powered by Claude AI · Leafy v1.0</footer>
</div>

<script>
  let selectedFile = null;

  const uploadZone = document.getElementById('uploadZone');
  const fileInput  = document.getElementById('fileInput');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const previewWrap = document.getElementById('previewWrap');
  const preview    = document.getElementById('preview');
  const loading    = document.getElementById('loading');
  const results    = document.getElementById('results');
  const errorBox   = document.getElementById('errorBox');

  // Drag & drop
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });
  uploadZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

  // Camera button — opens with camera on mobile
  document.getElementById('cameraBtn').addEventListener('click', () => {
    fileInput.setAttribute('capture', 'environment');
    fileInput.click();
  });

  function loadFile(file) {
    selectedFile = file;
    const url = URL.createObjectURL(file);
    preview.src = url;
    previewWrap.style.display = 'block';
    uploadZone.style.display = 'none';
    analyzeBtn.disabled = false;
    results.style.display = 'none';
    errorBox.style.display = 'none';
  }

  function resetAll() {
    selectedFile = null;
    fileInput.value = '';
    previewWrap.style.display = 'none';
    uploadZone.style.display = 'block';
    analyzeBtn.disabled = true;
    results.style.display = 'none';
    errorBox.style.display = 'none';
    loading.style.display = 'none';
  }

  analyzeBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    loading.style.display = 'block';
    results.style.display = 'none';
    errorBox.style.display = 'none';
    analyzeBtn.disabled = true;

    try {
      const base64 = await toBase64(selectedFile);
      const mediaType = selectedFile.type || 'image/jpeg';

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{
            role: 'user',
            content: [
              {
                type: 'image',
                source: { type: 'base64', media_type: mediaType, data: base64 }
              },
              {
                type: 'text',
                text: 'You are a botanist and plant care expert. Identify the plant in this image and provide care information.\n\n' +
                      'Respond ONLY with a valid JSON object (no markdown, no backticks, no extra text):\n' +
                      '{\n' +
                      '  "commonName": "e.g. Monstera",\n' +
                      '  "scientificName": "e.g. Monstera deliciosa",\n' +
                      '  "confidence": 85,\n' +
                      '  "notAPlant": false,\n' +
                      '  "watering": { "frequency": "Every 7-10 days", "description": "10-15 words about watering" },\n' +
                      '  "sunlight": { "level": "Bright indirect", "description": "10-15 words about light" },\n' +
                      '  "humidity": { "level": "High 60-80%", "description": "10-15 words about humidity" },\n' +
                      '  "difficulty": { "level": "Easy", "description": "10-15 words about care difficulty" },\n' +
                      '  "overallStatus": "good",\n' +
                      '  "statusLabel": "Healthy and Easy Care",\n' +
                      '  "advice": "2-3 sentences of personalised care advice and things to watch for."\n' +
                      '}\n\n' +
                      'overallStatus must be one of: good, warn, alert.\n' +
                      'If no plant is visible, set notAPlant to true and all other fields to null.'
              }
            ]
          }]
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error ${response.status}`);
      }

      const data = await response.json();
      const text = data.content.map(b => b.text || '').join('');
      const clean = text.replace(/```json|```/g, '').trim();
      const plant = JSON.parse(clean);

      loading.style.display = 'none';

      if (plant.notAPlant) {
        showError("🤔 That doesn't look like a plant! Try a clear photo of a leaf, flower, or the whole plant.");
        analyzeBtn.disabled = false;
        return;
      }

      renderResults(plant);

    } catch (e) {
      loading.style.display = 'none';
      showError('Something went wrong: ' + e.message);
      analyzeBtn.disabled = false;
    }
  });

  function renderResults(p) {
    document.getElementById('plantCommon').textContent = p.commonName;
    document.getElementById('plantScientific').textContent = p.scientificName;

    const conf = Math.min(100, Math.max(0, p.confidence));
    document.getElementById('confPct').textContent = conf + '%';
    setTimeout(() => {
      document.getElementById('confFill').style.width = conf + '%';
    }, 100);

    const careItems = [
      { label: 'Watering', value: p.watering?.frequency, desc: p.watering?.description, emoji: '💧' },
      { label: 'Sunlight', value: p.sunlight?.level,     desc: p.sunlight?.description,  emoji: '☀️' },
      { label: 'Humidity', value: p.humidity?.level,     desc: p.humidity?.description,  emoji: '🌫️' },
      { label: 'Difficulty', value: p.difficulty?.level, desc: p.difficulty?.description, emoji: '🌱' },
    ];

    const grid = document.getElementById('careGrid');
    grid.innerHTML = careItems.map(c => `
      <div class="care-card" data-emoji="${c.emoji}">
        <div class="care-card-label">${c.label}</div>
        <div class="care-card-value">${c.value || '—'}</div>
        <div class="care-card-desc">${c.desc || ''}</div>
      </div>
    `).join('');

    const statusMap = {
      good:  ['status-good', '✅'],
      warn:  ['status-warn', '⚠️'],
      alert: ['status-alert', '🚨'],
    };
    const [cls, icon] = statusMap[p.overallStatus] || statusMap.good;
    document.getElementById('statusPill').innerHTML = `
      <span class="status-pill ${cls}">
        <span class="status-dot"></span>
        ${icon} ${p.statusLabel || 'Care info below'}
      </span>`;

    document.getElementById('adviceText').textContent = p.advice;

    results.style.display = 'block';
    analyzeBtn.disabled = false;
    results.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function showError(msg) {
    errorBox.style.display = 'block';
    errorBox.textContent = msg;
  }

  function toBase64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result.split(',')[1]);
      r.onerror = () => rej(new Error('Failed to read file'));
      r.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
