<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encyklopedie žab</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green-dark: #1a3a2a;
    --green-mid: #2d5a3d;
    --green-light: #4a8c5c;
    --green-pale: #a8d5b5;
    --green-faint: #e8f5ec;
    --cream: #faf7f2;
    --brown: #6b4c2a;
    --text: #1a2e1f;
    --text-muted: #5a7060;
    --accent: #c8e6d0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--green-dark);
    padding: 3rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 50%, #2d5a3d55 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, #1a4a2a44 0%, transparent 55%);
  }
  .header-inner { position: relative; z-index: 1; }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    color: #e8f5ec;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  header p {
    margin-top: 0.75rem;
    font-size: 1rem;
    color: var(--green-pale);
    font-weight: 300;
    letter-spacing: 0.02em;
  }

  /* LANG TOGGLE */
  .lang-bar {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 1.5rem;
  }
  .lang-btn {
    padding: 8px 20px;
    border: 1.5px solid #4a8c5c;
    background: transparent;
    color: var(--green-pale);
    border-radius: 40px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .lang-btn.active, .lang-btn:hover {
    background: var(--green-light);
    border-color: var(--green-light);
    color: #fff;
  }

  /* STATS BAR */
  .stats-bar {
    background: var(--green-mid);
    padding: 1rem 2rem;
    display: flex;
    justify-content: center;
    gap: 3rem;
    flex-wrap: wrap;
  }
  .stat { text-align: center; }
  .stat-num { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: #e8f5ec; font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--green-pale); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

  /* GRID */
  .container { max-width: 960px; margin: 0 auto; padding: 3rem 1.5rem; }

  .section-heading {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--green-dark);
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--green-pale);
  }

  .frog-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }

  /* CARD */
  .frog-card {
    background: #fff;
    border-radius: 16px;
    border: 1px solid #d8ead0;
    overflow: hidden;
    display: grid;
    grid-template-columns: 220px 1fr;
    transition: box-shadow 0.2s, transform 0.2s;
  }
  .frog-card:hover { box-shadow: 0 8px 32px rgba(29,80,48,0.12); transform: translateY(-2px); }

  .card-visual {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    gap: 12px;
  }
  .frog-emoji { font-size: 56px; line-height: 1; }
  .frog-name-main {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
  }
  .frog-sci {
    font-size: 11px;
    font-style: italic;
    color: #888;
    text-align: center;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
  .tag {
    font-size: 10px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.03em;
  }

  .card-body { padding: 1.5rem 1.75rem 1.5rem 0; border-left: 1px solid #e8f0ea; }
  .frog-desc {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-muted);
    margin-bottom: 1.25rem;
  }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  .info-block {}
  .info-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--green-light);
    margin-bottom: 6px;
  }
  .ability-list { list-style: none; }
  .ability-list li {
    font-size: 12.5px;
    color: var(--text-muted);
    padding: 3px 0 3px 14px;
    position: relative;
    line-height: 1.5;
  }
  .ability-list li::before {
    content: '↗';
    position: absolute;
    left: 0;
    color: var(--green-light);
    font-size: 10px;
    top: 4px;
  }

  .meta-item { margin-bottom: 8px; }
  .meta-val { font-size: 13px; color: var(--text); line-height: 1.4; }

  .fun-fact {
    margin-top: 0.75rem;
    background: var(--green-faint);
    border-left: 3px solid var(--green-light);
    padding: 8px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 12.5px;
    color: var(--green-dark);
    line-height: 1.5;
  }
  .fun-fact-label {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--green-light);
    margin-bottom: 3px;
  }

  /* FOOTER */
  footer {
    background: var(--green-dark);
    color: var(--green-pale);
    text-align: center;
    padding: 1.5rem;
    font-size: 12px;
    letter-spacing: 0.03em;
  }

  @media (max-width: 640px) {
    .frog-card { grid-template-columns: 1fr; }
    .card-visual { border-left: none; border-bottom: 1px solid #e8f0ea; padding: 1.5rem; }
    .card-body { padding: 1.25rem; border-left: none; }
    .info-grid { grid-template-columns: 1fr; }
    .stats-bar { gap: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1 id="page-title">Encyklopedie žab</h1>
    <p id="page-sub">Prozkoumej svět žab — jejich schopnosti, výskyt a zajímavosti</p>
    <div class="lang-bar">
      <button class="lang-btn active" onclick="setLang('cs')" id="btn-cs">🇨🇿 Česky</button>
      <button class="lang-btn" onclick="setLang('en')" id="btn-en">🇬🇧 English</button>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-num">6</div><div class="stat-label" id="stat-frogs">Druhů žab</div></div>
  <div class="stat"><div class="stat-num">5</div><div class="stat-label" id="stat-cont">Kontinentů</div></div>
  <div class="stat"><div class="stat-num">7000+</div><div class="stat-label" id="stat-world">Druhů na světě</div></div>
</div>

<div class="container">
  <h2 class="section-heading" id="section-all">Všechny žáby</h2>
  <div class="frog-grid" id="frog-grid"></div>
</div>

<footer id="footer-text">Encyklopedie žab · Přepněte jazyk tlačítky výše</footer>

<script>

const frogs = [

  {

    bg: "#e6f0fb", tagBg: "#b5d0f0", tagColor: "#0c3a6e", namColor: "#0c3a6e",

    sci: "Pipa pipa",
    tags: { cs: ["Vodní", "Plochá", "Jih Ameriky"], en: ["Aquatic", "Flat", "South America"] },
    desc: {
      cs: "Extrémně plochá žaba bez jazyka ani zubů. Mláďata se vyvíjejí přímo v dírách na matčiných zádech.",

    },

  },
  {

    name: { cs: "Létající žaba Wallaceova", en: "Wallace's Flying Frog" },
    sci: "Rhacophorus nigropalmatus",

    desc: {
      cs: "Tato žaba skutečně létá! Pomocí obrovských plovacích blan klouzá vzduchem z větve na větev v korunách džungle.",

  },
  {
    icon: "❄️",
    bg: "#eeecfe", tagBg: "#ccc8f0", tagColor: "#2e1a7a", namColor: "#2e1a7a",
    name: { cs: "Lesní žába dřevěná", en: "Wood Frog" },
    sci: "Rana sylvatica",
    tags: { cs: ["Mráz", "Arktická", "Severní Amerika"], en: ["Freeze", "Arctic", "North America"] },

    },

let lang = 'cs';

function setLang(l) {
  lang = l;
  document.getElementById('btn-cs').classList.toggle('active', l === 'cs');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.documentElement.lang = l;
  const t = T[l];
  document.getElementById('page-title').textContent = t.pageTitle;
  document.getElementById('page-sub').textContent = t.pageSub;
  document.getElementById('stat-frogs').textContent = t.statFrogs;
  document.getElementById('stat-cont').textContent = t.statCont;
  document.getElementById('stat-world').textContent = t.statWorld;
  document.getElementById('section-all').textContent = t.sectionAll;
  document.getElementById('footer-text').textContent = t.footer;
  renderFrogs();
}

function renderFrogs() {
  const t = T[lang];
  document.getElementById('frog-grid').innerHTML = frogs.map(f => `
    <div class="frog-card">
      <div class="card-visual" style="background:${f.bg}">
        <div class="frog-emoji">${f.icon}</div>
        <div class="frog-name-main" style="color:${f.namColor}">${f.name[lang]}</div>
        <div class="frog-sci">${f.sci}</div>
        <div class="tags">
          ${f.tags[lang].map(tag => `<span class="tag" style="background:${f.tagBg};color:${f.tagColor}">${tag}</span>`).join('')}
        </div>
      </div>
      <div class="card-body">
        <p class="frog-desc">${f.desc[lang]}</p>
        <div class="info-grid">
          <div class="info-block">
            <div class="info-label">${t.abilities}</div>
            <ul class="ability-list">
              ${f.abilities[lang].map(a => `<li>${a}</li>`).join('')}
            </ul>
          </div>
          <div class="info-block">
            <div class="meta-item">
              <div class="info-label">${t.habitat}</div>
              <div class="meta-val">${f.habitat[lang]}</div>
            </div>
            <div class="meta-item">
              <div class="info-label">${t.diet}</div>
              <div class="meta-val">${f.diet[lang]}</div>
            </div>
            <div class="meta-item">
              <div class="info-label">${t.size}</div>
              <div class="meta-val">${f.size[lang]}</div>
            </div>
            <div class="fun-fact">
              <div class="fun-fact-label">${t.funFact}</div>
              ${f.funFact[lang]}
            </div>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

renderFrogs();
</script>
</body>
</html>
